{% extends "base.html" %}{% block body %}
<h1>Product knowledge</h1>
<p class="muted small">Everything about amasol and klaricore is content, read at run time. Edit it here; the next research or brief uses it. Case studies and proof points in briefs come only from here.</p>
<div class="tabs">{% for f in files %}<a href="/knowledge?f={{ f }}" class="{{ 'on' if f == current }}">{{ f }}</a>{% endfor %}</div>
<form method="post" action="/knowledge" class="card"><input type="hidden" name="f" value="{{ current }}">
<textarea name="text" rows="28" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">{{ text }}</textarea>
<p><button class="btn primary">Save</button></p></form>
{% endblock %}
